<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Been There</title>
<style>
  :root {
    --ocean:    #1b4b8f;
    --land:     #8a8a8a;
    --visited:  #ff8c1a;
    --border:   #33333a;
    --bg:       #05070f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Serve l'!important. La regola [hidden]{display:none} e' del foglio di stile
     del browser, e QUALSIASI regola d'autore la batte: #ui{display:flex} qui
     sotto vinceva, quindi l'attributo hidden su #ui non nascondeva niente. Su
     Android la chrome HTML restava a schermo sopra la UI Compose, raddoppiando
     contatore e campo di ricerca (e il duplicato era pure inerte, perche'
     wireUi() giustamente non gira quando c'e' il bridge nativo). */
  [hidden] { display: none !important; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: #e8e8ee; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  #globe { position: fixed; inset: 0; }
  /* indispensabile: senza questo il pinch lo intercetta la pagina, non OrbitControls */
  #globe canvas { touch-action: none; display: block; }

  /* --- chrome HTML: in Android sarà rimpiazzata dalla UI Compose (vedi DEMO_UI) --- */
  #ui { position: fixed; top: 0; left: 0; right: 0; padding: 12px; z-index: 10;
        display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #counter { align-self: flex-start; font-size: 15px; font-weight: 600; letter-spacing: .2px;
             background: rgba(5,7,15,.72); border: 1px solid #23232c; border-radius: 999px;
             padding: 7px 14px; backdrop-filter: blur(6px); }
  #counter b { color: var(--visited); }
  #searchWrap { position: relative; max-width: 520px; width: 100%; }
  #search { width: 100%; font: inherit; font-size: 15px; color: #e8e8ee;
            background: rgba(5,7,15,.72); border: 1px solid #23232c; border-radius: 12px;
            padding: 11px 14px; outline: none; backdrop-filter: blur(6px); }
  #search:focus { border-color: var(--visited); }
  #search::placeholder { color: #7b7b88; }
  #results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 46vh;
             overflow-y: auto; -webkit-overflow-scrolling: touch;
             background: rgba(9,12,22,.96); border: 1px solid #23232c; border-radius: 12px;
             display: none; }
  #results.open { display: block; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer;
         border-bottom: 1px solid #17171f; }
  .row:last-child { border-bottom: 0; }
  .row:hover, .row.sel { background: #141a2b; }
  .row .nm { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .cc { font-size: 11px; color: #6f6f7d; font-variant-numeric: tabular-nums; }
  .row .tg { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1px solid #2b2b36;
             background: transparent; cursor: pointer; display: grid; place-items: center; }
  .row .tg i { width: 12px; height: 12px; border-radius: 50%; background: var(--land); display: block; }
  .row.on .tg i { background: var(--visited); }
  .row.on .tg { border-color: var(--visited); }
  .empty { padding: 12px; font-size: 13px; color: #7b7b88; }

  /* Windows non ha i glifi delle bandiere: Microsoft li ha esclusi apposta da
     Segoe UI Emoji, quindi Chrome su Windows non trova la coppia di indicatori
     regionali e disegna le due lettere separate. Questo font contiene SOLO le
     bandiere (78 KB) e, messo per primo nella catena di .flag, le risolve su
     ogni piattaforma. unicode-range lo limita agli indicatori regionali: non
     viene nemmeno scaricato finche' non si apre un popup con bandiera.
     WebViewAssetLoader puo' servirlo con un MIME type generico (su Android 8
     .woff2 non e' nella tabella di sistema): non e' un problema, i font non
     sono soggetti al controllo del MIME type, il formato viene riconosciuto
     dai byte. */
  @font-face {
    font-family: "Twemoji Country Flags";
    src: url("TwemojiCountryFlags.woff2") format("woff2");
    font-display: swap;
    unicode-range: U+1F1E6-1F1FF;
  }

  /* --- popup del paese selezionato ---------------------------------------
     Vive nel layer htmlElements di globe.gl (un CSS2DRenderer): la posizione
     la ricalcola la libreria a ogni frame, quindi la card resta incollata al
     paese mentre la sfera ruota, senza codice di posizionamento qui dentro.
     Il contenitore di quel layer ha pointer-events: none, cosi' il trascina-
     mento del globo passa sotto: la card se li riaccende solo per se'. */
  .pin { position: absolute; width: 0; height: 0; transition: opacity .18s ease; }
  .pin.behind { opacity: 0; }           /* paese dietro l'orizzonte del globo */
  .pin.behind .card { pointer-events: none; }

  .pin .dot { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px;
              border-radius: 50%; border: 2px solid #e8e8ee; box-sizing: border-box; }
  .pin .stem { position: absolute; left: -1px; top: -20px; width: 2px; height: 20px;
               background: linear-gradient(to bottom, #3a3a46, rgba(58,58,70,0)); }

  .pin .card { position: absolute; left: 0; top: 0;
               transform: translate(-50%, calc(-100% - 20px));
               pointer-events: auto; touch-action: manipulation;
               min-width: 180px; max-width: 260px;
               background: rgba(9,12,22,.94); border: 1px solid #2b2b36; border-radius: 14px;
               padding: 10px 12px 11px; box-shadow: 0 12px 34px rgba(0,0,0,.55);
               backdrop-filter: blur(6px); }
  .pin .hd { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  /* Le bandiere sono emoji costruite dall'ISO_A2. Il font imbustato viene per
     primo, poi le emoji di sistema (su Android le bandiere ci sono gia'). */
  .pin .flag { flex: none; width: 30px; height: 22px; border-radius: 4px; overflow: hidden;
               border: 1px solid #2b2b36; background: #12121a;
               display: grid; place-items: center;
               font-family: "Twemoji Country Flags", "Noto Color Emoji",
                            "Segoe UI Emoji", "Apple Color Emoji", system-ui, sans-serif;
               font-size: 15px; line-height: 1; }
  .pin .nm { font-size: 14px; font-weight: 600; line-height: 1.25; }

  .pin .tgl { width: 100%; display: flex; align-items: center; justify-content: space-between;
              gap: 12px; font: inherit; font-size: 13px; color: #e8e8ee; text-align: left;
              background: #12121a; border: 1px solid #2b2b36; border-radius: 10px;
              padding: 7px 9px; cursor: pointer; }
  .pin .tgl .sw { flex: none; position: relative; width: 34px; height: 20px;
                  border-radius: 999px; background: #2b2b36; transition: background .16s; }
  .pin .tgl .sw i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
                    border-radius: 50%; background: #7b7b88;
                    transition: transform .16s, background .16s; }
  .pin .tgl[aria-checked="true"] { border-color: var(--visited); }
  .pin .tgl[aria-checked="true"] .sw { background: rgba(255,140,26,.32); }
  .pin .tgl[aria-checked="true"] .sw i { transform: translateX(14px); background: var(--visited); }

  /* --- schermata di caricamento ------------------------------------------
     Copre i secondi in cui il globo si costruisce. Il vincolo che detta tutto
     il disegno qui sotto: la tassellatura BLOCCA il thread principale, quindi
     si muove soltanto cio' che il compositor anima da se', cioe' transform e
     opacity. Un'animazione su background-position, su un attributo SVG o
     guidata da JS si inchioderebbe proprio mentre serve, e sembrerebbe che
     l'app si sia piantata. */
  #status { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
            background: var(--bg); padding: 24px; text-align: center; font-size: 14px; line-height: 1.6;
            transition: opacity .35s ease; }
  #status.fading { opacity: 0; pointer-events: none; }
  #status.hidden { display: none; }
  #status code { background: #12121a; padding: 2px 6px; border-radius: 4px; color: #ffb066; }
  #status .err { color: #ff6b6b; font-weight: 600; }

  #loader { display: grid; place-items: center; gap: 18px; }

  /* Il globo di attesa. 104px non e' un numero a caso: i paralleli qui sotto
     sono posizionati in pixel, perche' vanno spaziati come il seno della
     latitudine e un gradiente non sa farlo in percentuale. Cambiando questa
     misura vanno rifatti anche quelli. */
  .wire { position: relative; width: 104px; height: 104px; border-radius: 50%;
          overflow: hidden; border: 1px solid rgba(120,170,255,.30);
          background: radial-gradient(circle at 34% 30%, #113059 0%, #0b1c38 58%, #071023 100%);
          box-shadow: 0 0 28px rgba(91,143,214,.16); }

  /* Meridiani. Una striscia piu' larga del cerchio che scorre verso sinistra:
     dietro il ritaglio circolare legge come la sfera che gira. Trasla di
     ESATTAMENTE un periodo del motivo (26px), quindi il ciclo si richiude su
     se stesso e non si vede la giunta, qualunque sia la larghezza. */
  .wire .merid { position: absolute; top: -6%; left: 0; width: 200%; height: 112%;
                 background: repeating-linear-gradient(to right,
                   transparent 0 14px, rgba(120,170,255,.42) 14px 15px);
                 animation: wire-spin 1.7s linear infinite; }
  @keyframes wire-spin { from { transform: translateX(0); } to { transform: translateX(-15px); } }

  /* Paralleli, fermi: ruotando attorno all'asse polare non si muovono davvero.
     Spaziati come sin(latitudine) - 0, +-30, +-60 gradi - ed e' questo, piu'
     della sfumatura, a far leggere una sfera invece di un cilindro. */
  .wire .par { position: absolute; inset: 0;
               background: linear-gradient(to bottom,
                 transparent 0 6px,   rgba(120,170,255,.34) 6px 7px,
                 transparent 7px 25px,  rgba(120,170,255,.34) 25px 26px,
                 transparent 26px 51px, rgba(120,170,255,.44) 51px 52px,
                 transparent 52px 77px, rgba(120,170,255,.34) 77px 78px,
                 transparent 78px 96px, rgba(120,170,255,.34) 96px 97px,
                 transparent 97px); }

  /* Volume, e soprattutto il trucco che regge tutta l'illusione. Su una sfera
     vera i meridiani si stringono avvicinandosi al limbo; questi sono dritti e
     paralleli, quindi proprio li' tradirebbero il cilindro. Le due sfumature
     spengono il reticolo prima che ci arrivi: la radiale scurisce il bordo in
     tutte le direzioni, quella orizzontale insiste su destra e sinistra, che
     sono i lati dove l'occhio se ne accorgerebbe. */
  .wire .shade { position: absolute; inset: 0; border-radius: 50%;
                 background:
                   linear-gradient(to right, rgba(7,16,35,.92) 0%, rgba(7,16,35,0) 26%,
                                             rgba(7,16,35,0) 74%, rgba(7,16,35,.92) 100%),
                   radial-gradient(circle at 50% 50%, transparent 26%, rgba(5,7,15,.46) 66%, rgba(5,7,15,.93) 100%),
                   radial-gradient(circle at 33% 27%, rgba(150,190,255,.20), transparent 58%); }

  #phase { font-size: 13px; color: #7b7b88; letter-spacing: .2px; }

  /* Chi non vuole animazioni non le subisce nemmeno qui. */
  @media (prefers-reduced-motion: reduce) {
    .wire .merid { animation: none; }
  }
</style>
</head>
<body>

<div id="globe"></div>

<div id="ui" hidden>
  <div id="counter">&mdash; / &mdash; paesi</div>
  <div id="searchWrap">
    <input id="search" type="search" autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" placeholder="Cerca un paese…">
    <div id="results"></div>
  </div>
</div>

<!-- Questo blocco e' HTML statico: viene dipinto appena il documento e' letto,
     prima ancora che globe.gl.min.js venga eseguito. E' il motivo per cui il
     globo di attesa compare subito e non dopo un secondo di schermo nero. -->
<div id="status">
  <div id="loader">
    <div class="wire"><div class="merid"></div><div class="par"></div><div class="shade"></div></div>
    <div id="phase">Carico i confini…</div>
  </div>
  <div id="oops" hidden></div>
</div>

<script src="globe.gl.min.js"></script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------ config
  var OCEAN   = '#1b4b8f';
  var LAND    = '#8a8a8a';
  var VISITED = '#ff8c1a';
  var BORDER  = '#33333a';
  // Confine del paese selezionato. Bianco di proposito: non e' ne' il grigio
  // del non visitato ne' l'arancione del visitato, cosi' "selezionato" resta
  // leggibile sopra entrambi senza aggiungere un terzo significato al colore
  // di riempimento.
  var BORDER_SEL = '#ffffff';
  var BG      = '#05070f';

  // ALTITUDINI. Sono tre gusci distinti e non si toccano mai: calotte, rete dei
  // confini, contorno del selezionato. Su un globo di raggio 100 la distanza
  // fra un guscio e il successivo e' 0,3 unita'. Vale la pena spiegare da dove
  // viene quel numero, perche' e' la meta' della cura allo sfarfallio.
  //
  // Prima erano 0,01 unita' (three-globe mette il contorno a 1e-4 di scala
  // sopra la calotta) e il contorno lampeggiava a chiazze. Il colpevole non e'
  // la geometria ma il depth buffer: globe.gl imposta camera.near = 0,05 e
  // lascia far grandissimo, e con quella coppia il quanto di profondita' a
  // distanza z vale circa z^2 / (near * 2^bit). Col globo inquadrato da lontano
  // (z ~ 340) fanno 0,14 unita' a 24 bit e 35 unita' se il dispositivo alloca
  // un depth buffer a 16 bit: quattordici e tremila volte la separazione che
  // c'era. Il confronto di profondita' fra calotta e contorno diventava rumore,
  // ed e' per questo che il difetto peggiorava rimpicciolendo il globo.
  // La cura vera e' updateClipPlanes(), che stringe near/far attorno alla sfera
  // a ogni movimento di camera; queste tre quote sono il margine di sicurezza
  // che resta valido anche nel caso peggiore (16 bit, globo lontanissimo).
  var CAP_ALT    = 0.002;   // calotte dei paesi
  var BORDER_ALT = 0.005;   // rete dei confini, unica per tutto il pianeta
  var SEL_ALT    = 0.008;   // contorno del paese selezionato
  var POPUP_ALT  = 0.014;   // ancora della card

  // Suddivisione degli spigoli dei confini, in gradi. Lo spigolo piu' lungo del
  // dataset misura 5,65 gradi, quindi con questo passo si suddivide poco (7092
  // spigoli unici diventano 7549 segmenti) ma nessuna corda taglia dentro la
  // sfera: la freccia di una corda di 1,5 gradi e' 0,0086 unita' su raggio 100,
  // trentacinque volte meno del gradino fra un guscio e l'altro.
  var BORDER_STEP_DEG = 1.5;

  // Lato delle calotte. 0 = FrontSide: dopo il riavvolgimento per d3-geo i
  // triangoli guardano fuori dalla sfera, quindi il culling delle facce
  // posteriori scarta l'emisfero nascosto prima di rasterizzarlo. Se un giorno
  // le calotte sparissero, il sospettato e' questo: 2 = DoubleSide le rimette.
  var CAP_SIDE = 0;

  // TASSELLATURA DELLA CALOTTA.
  // three-conic-polygon-geometry costruisce la calotta triangolando con
  // Delaunay il contorno piu' un reticolo di Fibonacci di punti interni, e
  // SCARTA i triangoli che toccano il contorno se il loro baricentro cade fuori
  // dal poligono. Vicino a una rientranza del confine capita che un triangolo
  // che copre terra buona abbia il baricentro appena oltre il bordo: viene
  // buttato, e al suo posto si vede la sfera, cioe' un cuneo blu dentro il
  // paese. Non sono buchi nel GeoJSON: la copertura e' stata verificata a 3 km
  // e l'unica zona scoperta della regione e' il Caspio.
  //
  // Col default di globe.gl (5 gradi) il pianeta intero riceve 444 punti
  // interni: la Russia 54, il Kazakistan una decina. Ma abbassare la
  // risoluzione globale non basta, perche' il reticolo e' uniforme e un paese
  // piccolo continua a prendere le briciole: a 1 grado restano 49 paesi interi
  // con 8 punti o meno (Svizzera 3, Belgio 3, Israele 1, Libano 1, Kuwait 1).
  //
  // Il reticolo ha densita' esattamente 1/res^2 punti per grado quadrato (i
  // (360/res)^2/pi punti della sfera divisi per i suoi 41.253 gradi quadrati),
  // quindi per garantire a un poligono di area A almeno N punti interni basta
  // res = sqrt(A/N). Da qui la risoluzione per paese qui sotto.
  //
  // I due limiti non sono arbitrari, sono misurati:
  //  - MAX 0.5 tiene il cuneo peggiore sotto i ~55 km anche per la Russia;
  //  - MIN 0.25 protegge i micro-stati. Sotto la sua dimensione un poligono
  //    passa a earcut, che e' una triangolazione esatta e non sbaglia mai:
  //    scendendo sotto 0.25 si strappano Malta, Singapore, Andorra e compagnia
  //    da quel ramo sicuro e si peggiora. Contati i paesi interi con <=8 punti:
  //    49 con l'uniforme a 1 grado, 27 con l'uniforme a 0.5, 15 con questa
  //    regola, poi si risale a 24 col minimo a 0.15 e a 45 col minimo a 0.05.
  // Costo: 103.735 test punto-in-poligono all'avvio contro i 931 del default,
  // una tantum, e ora davvero una sola volta: le calotte vengono fuse in una
  // mesh e il layer poligoni viene smontato subito dopo.
  var CAP_TARGET_PTS = 60;
  var CAP_RES_MIN = 0.25;
  var CAP_RES_MAX = 0.5;
  var DEG2_PER_SR = Math.pow(180 / Math.PI, 2);

  // Lato delle celle dell'indice spaziale per il tocco, in gradi. Con 5 gradi
  // il pianeta sta in 2592 celle, ne restano occupate 1588 e la cella piu'
  // affollata offre 11 poligoni candidati: un tocco costa mezzo microsecondo.
  var PICK_CELL_DEG = 5;

  // Su Android la chrome HTML resta spenta: contatore, ricerca e lista li fa
  // Compose parlando con window.BeenThere.*, e la verità sta in DataStore.
  // Nel browser desktop AndroidBridge non esiste, quindi il prototipo resta
  // pienamente usabile senza toccare un flag.
  var HAS_NATIVE = (typeof window.AndroidBridge !== 'undefined');
  var DEMO_UI = !HAS_NATIVE;
  var DEMO_PERSISTENCE = !HAS_NATIVE;
  var LS_KEY = 'beenthere.visited.demo';

  // Se resta null, il denominatore è il numero di poligoni realmente presenti
  // nel GeoJSON (non 195 - vedi note).
  var TOTAL_OVERRIDE = null;

  // ------------------------------------------------------------------- stato
  var world = null;
  var features = [];
  var byKey = Object.create(null);     // chiave paese -> feature
  var idxOf = Object.create(null);     // chiave paese -> indice in features
  var visited = new Set();
  var searchIndex = [];                // { key, label, hay, feat }
  var selIdx = -1;
  var lang = 'it';                     // 'it' | 'en', spinta da Kotlin
  var selected = null;                 // chiave del paese col popup aperto
  var popupEls = null;                 // riferimenti dentro il popup in scena

  // scena costruita da noi (vedi buildMergedScene)
  var capMesh = null;                  // unica mesh con TUTTE le calotte
  var capColorAttr = null;             // attributo colore per-vertice
  var capColorArr = null;
  var capRange = [];                   // indice feature -> { start, count } in vertici
  var outlineMesh = null;              // contorni per-paese, mostrati con setDrawRange
  var outlineRange = [];               // indice feature -> { start, count } in vertici
  var LAND_RGB = null, VISITED_RGB = null;

  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $('status');

  // L'errore spegne il globo di attesa e prende il suo posto. Prima scriveva in
  // innerHTML su #status, che oggi cancellerebbe il wireframe: i due ruoli
  // stanno in due elementi separati apposta.
  function fail(msg, hint) {
    statusEl.classList.remove('hidden', 'fading');
    var loader = $('loader');
    if (loader) loader.hidden = true;
    var oops = $('oops');
    oops.hidden = false;
    oops.innerHTML = '<div class="err">' + msg + '</div>' + (hint || '');
  }

  function setPhase(txt) {
    var el = $('phase');
    if (el) el.textContent = txt;
  }

  // --------------------------------------------------- identità di un paese
  // Natural Earth mette ISO_A3 = "-99" per Kosovo, Cipro del Nord, Somaliland
  // e, in alcune release, anche per Francia e Norvegia. Usando ISO_A3 nudo
  // finirebbero tutti sulla stessa chiave e si colorerebbero insieme.
  // Questa è l'UNICA funzione di identificazione usata in tutta l'app.
  function rawProp(props, names) {
    for (var i = 0; i < names.length; i++) {
      var n = names[i];
      var v = props[n];
      if (v == null) v = props[n.toLowerCase()];
      if (v == null) v = props[n.toUpperCase()];
      if (v != null && String(v).trim() !== '') return String(v).trim();
    }
    return null;
  }
  function isBadCode(v) { return !v || v === '-99' || v === '-099' || v === '099'; }

  function countryKey(feat) {
    if (feat.__key) return feat.__key;
    var p = feat.properties || {};
    // Solo questi due, in quest'ordine. NON aggiungere ISO_A3_EH: per le
    // dipendenze contiene il codice dello STATO SOVRANO (Ashmore e Indian Ocean
    // Ter. valgono "AUS"), quindi si colorerebbero insieme all'Australia. Stesso
    // problema, per definizione, con SOV_A3. Verificato sul 50m: ISO_A3 ->
    // ADM0_A3 da' 242 chiavi uniche su 242 feature.
    var cands = [
      rawProp(p, ['ISO_A3']),
      rawProp(p, ['ADM0_A3'])
    ];
    var key = null;
    for (var i = 0; i < cands.length; i++) {
      if (!isBadCode(cands[i])) { key = cands[i].toUpperCase(); break; }
    }
    if (!key) {
      // ultima spiaggia: nome normalizzato, prefissato per non collidere con un ISO
      var nm = rawProp(p, ['NAME', 'NAME_LONG', 'ADMIN', 'BRK_NAME']) || 'UNKNOWN';
      key = 'X_' + norm(nm).replace(/[^a-z0-9]+/g, '_').toUpperCase();
    }
    feat.__key = key;
    return key;
  }

  function countryNameEn(feat) {
    var p = feat.properties || {};
    return rawProp(p, ['NAME']) || rawProp(p, ['NAME_LONG']) ||
           rawProp(p, ['ADMIN']) || countryKey(feat);
  }
  // Dove NAME_IT manca nel dataset si ricade sul nome inglese.
  function countryNameIt(feat) {
    return rawProp(feat.properties || {}, ['NAME_IT']) || countryNameEn(feat);
  }
  function countryName(feat) {
    return lang === 'en' ? countryNameEn(feat) : countryNameIt(feat);
  }

  // ------------------------------------------------------------------ lingua
  // La lingua la decide Kotlin (DataStore) e arriva con BeenThere.setLanguage.
  // Qui servono le poche stringhe che la pagina disegna da se': il popup, che
  // si vede anche su Android, e la chrome HTML del prototipo browser.
  var STR = {
    // Nota sulle due frasi di caricamento: a schermo sono sempre quelle
    // italiane, perche' la lingua arriva da Kotlin con setLanguage() e quella
    // chiamata segue onGlobeReady, cioe' quando la schermata e' gia' sparita.
    // Stanno qui lo stesso, cosi' se un giorno la lingua venisse spinta prima
    // funzionano senza altre modifiche.
    it: { visited: 'Visitato', visitedAria: 'Segna come visitato',
          countries: 'paesi', noResults: 'Nessun paese trovato.',
          searchPh: 'Cerca un paese…',
          loadingBorders: 'Carico i confini…', buildingGlobe: 'Costruisco il globo…' },
    en: { visited: 'Visited', visitedAria: 'Mark as visited',
          countries: 'countries', noResults: 'No country found.',
          searchPh: 'Search a country…',
          loadingBorders: 'Loading borders…', buildingGlobe: 'Building the globe…' }
  };
  function t(key) { return (STR[lang] || STR.it)[key]; }

  // Bandiera come emoji: due indicatori regionali costruiti dall'ISO_A2. Zero
  // asset e zero rete, e su Android le disegna il font di sistema.
  // Natural Earth mette ISO_A2 = "-99" su 9 feature; per le quattro che uno
  // stato con bandiera ce l'hanno davvero si recupera da ADM0_A3. Le altre
  // (Somaliland, Cipro del Nord, Siachen, i due territori australiani) non
  // hanno un codice ISO: restano senza bandiera, con il solo nome.
  var A2_FALLBACK = { FRA: 'FR', NOR: 'NO', KOS: 'XK', TWN: 'TW' };
  function flagEmoji(feat) {
    var p = feat.properties || {};
    var a2 = rawProp(p, ['ISO_A2']);
    if (!a2 || !/^[A-Za-z]{2}$/.test(a2)) a2 = A2_FALLBACK[rawProp(p, ['ADM0_A3'])] || null;
    if (!a2) return null;
    a2 = a2.toUpperCase();
    return String.fromCodePoint(0x1F1E6 + a2.charCodeAt(0) - 65,
                                0x1F1E6 + a2.charCodeAt(1) - 65);
  }

  // Catalogo completo, passato una volta sola a Kotlin: da qui Compose ricava
  // l'indice di ricerca e il denominatore del contatore.
  function catalogJson() {
    return JSON.stringify(features.map(function (f) {
      return {
        code: countryKey(f),
        nameIt: countryNameIt(f),
        nameEn: countryNameEn(f)
      };
    }));
  }

  // classe dei segni diacritici combinanti, costruita senza escape letterali
  var DIACRITICS = new RegExp('[' + String.fromCharCode(768) + '-' + String.fromCharCode(879) + ']', 'g');
  function norm(s) {
    return String(s).normalize('NFD').replace(DIACRITICS, '').toLowerCase();
  }

  // -------------------------------------------------------------- geometria

  // VERSO DEGLI ANELLI. three-globe costruisce le calotte con
  // three-conic-polygon-geometry, che si appoggia a d3-geo. d3-geo usa la
  // convenzione sferica OPPOSTA a RFC 7946: l'anello esterno va in senso
  // ORARIO (area sferica con segno positiva), i buchi in senso antiorario.
  // Il nostro GeoJSON e' RFC 7946 (esterni antiorari): tutti e 470 i poligoni
  // hanno area sferica negativa, quindi d3 li legge come il COMPLEMENTO del
  // paese. Conseguenze viste a schermo:
  //   - d3.geoBounds restituisce l'intera sfera, la libreria crede che il
  //     poligono contenga i poli e passa al ramo di triangolazione sferica;
  //   - li' il punto-dentro-poligono e' geoContains, che sul complemento e'
  //     vero FUORI dai confini: la calotta colorata copre tutto tranne il
  //     paese, e il raycast del click finisce sulla mesh di un altro paese
  //     (di qui il "seleziona quello accanto").
  // Si riavvolge una volta sola, in place, prima di passare i dati al globo.
  var RING_RAD = Math.PI / 180, RING_QUARTER_PI = Math.PI / 4;

  // Area sferica con segno di un anello: stessa formula di d3-geo/area.js,
  // cosi' il criterio qui e' identico a quello che applichera' la libreria.
  // Il modulo sull'indice richiude l'anello anche se il GeoJSON non lo fosse
  // (su un anello gia' chiuso l'ultimo segmento e' nullo e non contribuisce).
  function sphericalRingSum(ring) {
    var sum = 0, lambda0 = 0, cosPhi0 = 0, sinPhi0 = 0, n = ring.length;
    for (var i = 0; i <= n; i++) {
      var pt = ring[i % n];
      var lambda = pt[0] * RING_RAD, phi = pt[1] * RING_RAD / 2 + RING_QUARTER_PI;
      var cosPhi = Math.cos(phi), sinPhi = Math.sin(phi);
      if (i > 0) {
        var d = lambda - lambda0, sg = d >= 0 ? 1 : -1, ad = sg * d, k = sinPhi0 * sinPhi;
        sum += Math.atan2(k * sg * Math.sin(ad), cosPhi0 * cosPhi + k * Math.cos(ad));
      }
      lambda0 = lambda; cosPhi0 = cosPhi; sinPhi0 = sinPhi;
    }
    return sum;
  }

  // Si somma su tutti gli anelli del poligono (esterno + buchi), come fa d3
  // tra polygonStart e polygonEnd, e se il totale e' negativo si invertono
  // TUTTI gli anelli: il verso relativo buchi/esterno resta corretto.
  function rewindPolygon(rings) {
    var sum = 0;
    for (var i = 0; i < rings.length; i++) sum += sphericalRingSum(rings[i]);
    if (sum < 0) {
      for (var j = 0; j < rings.length; j++) rings[j].reverse();
      return true;
    }
    return false;
  }
  // Ogni poligono di un MultiPolygon e' una calotta a se': va valutato da solo.
  function rewindGeometry(geom) {
    if (!geom) return 0;
    if (geom.type === 'Polygon') return rewindPolygon(geom.coordinates) ? 1 : 0;
    if (geom.type === 'MultiPolygon') {
      var n = 0;
      for (var i = 0; i < geom.coordinates.length; i++) {
        if (rewindPolygon(geom.coordinates[i])) n++;
      }
      return n;
    }
    return 0;
  }

  // Area di un poligono in gradi quadrati, dalla stessa somma sferica usata per
  // il verso degli anelli: sommaAnelli * 2 sono steradianti, il fattore li
  // porta in gradi quadrati.
  function polygonAreaDeg2(rings) {
    var sr = 0;
    for (var i = 0; i < rings.length; i++) sr += sphericalRingSum(rings[i]);
    return Math.abs(sr * 2) * DEG2_PER_SR;
  }

  // Elenco dei poligoni di una feature, ognuno come array di anelli.
  function polygonsOf(geom) {
    if (!geom) return [];
    if (geom.type === 'Polygon') return [geom.coordinates];
    if (geom.type === 'MultiPolygon') return geom.coordinates;
    return [];
  }

  // Risoluzione di tassellatura di questa feature (vedi il blocco su
  // CAP_TARGET_PTS). Si guarda il poligono piu' grande: e' quello che detta
  // quanto grossi vengono i triangoli, e quindi quanto puo' essere grosso un
  // cuneo perso. Memorizzata sulla feature perche' l'accessor viene rieseguito
  // a ogni digest, e un valore che cambia farebbe ritassellare tutto.
  function capResolution(feat) {
    if (feat.__capRes) return feat.__capRes;
    var polys = polygonsOf(feat.geometry);
    var biggest = 0;
    for (var i = 0; i < polys.length; i++) {
      var a = polygonAreaDeg2(polys[i]);
      if (a > biggest) biggest = a;
    }
    var res = Math.sqrt(biggest / CAP_TARGET_PTS);
    feat.__capRes = Math.min(CAP_RES_MAX, Math.max(CAP_RES_MIN, res));
    return feat.__capRes;
  }

  function outerRings(geom) {
    var polys = polygonsOf(geom), out = [];
    for (var i = 0; i < polys.length; i++) out.push(polys[i][0]);
    return out;
  }
  function ringArea(r) {
    var a = 0;
    for (var i = 0, j = r.length - 1; i < r.length; j = i++) {
      a += r[j][0] * r[i][1] - r[i][0] * r[j][1];
    }
    return Math.abs(a / 2);
  }
  // Centroide dell'anello più grande: evita che Russia/USA/Fiji (antimeridiano)
  // finiscano centrati in mezzo all'oceano da un banale centro di bounding box.
  function focusOf(feat) {
    if (feat.__focus) return feat.__focus;
    var rings = outerRings(feat.geometry), best = null, bestA = -1;
    for (var i = 0; i < rings.length; i++) {
      var a = ringArea(rings[i]);
      if (a > bestA) { bestA = a; best = rings[i]; }
    }
    var lat = 0, lng = 0, alt = 1.2;
    if (best && best.length) {
      var x = 0, y = 0, a2 = 0;
      for (var k = 0, j = best.length - 1; k < best.length; j = k++) {
        var f = best[j][0] * best[k][1] - best[k][0] * best[j][1];
        a2 += f; x += (best[j][0] + best[k][0]) * f; y += (best[j][1] + best[k][1]) * f;
      }
      a2 *= 0.5;
      if (Math.abs(a2) > 1e-12) { lng = x / (6 * a2); lat = y / (6 * a2); }
      else { lng = best[0][0]; lat = best[0][1]; }

      var minX = 180, maxX = -180, minY = 90, maxY = -90;
      for (var m = 0; m < best.length; m++) {
        var c = best[m];
        if (c[0] < minX) minX = c[0];
        if (c[0] > maxX) maxX = c[0];
        if (c[1] < minY) minY = c[1];
        if (c[1] > maxY) maxY = c[1];
      }
      var span = Math.max((maxX - minX) * Math.cos(lat * Math.PI / 180), maxY - minY);
      alt = Math.min(2.0, Math.max(0.22, span / 22));
    }
    feat.__focus = { lat: lat, lng: lng, altitude: alt };
    return feat.__focus;
  }

  // ------------------------------------------------- indice spaziale e tocco
  // Il tocco non passa piu' dal raycast. Con la scena fusa le mesh su cui
  // sparare un raggio sarebbero due o tre, e nessuna corrisponde piu' a un
  // singolo paese; ma soprattutto il raycast di globe.gl gira a ogni frame (20
  // volte al secondo, throttle di 50 ms) e prima doveva attraversare 940
  // oggetti fra calotte e contorni. Qui si prende la lat/lng dove il raggio ha
  // incontrato la sfera - quella globe.gl la fornisce gia' in onGlobeClick - e
  // si cerca il paese con un point-in-polygon sul GeoJSON.
  //
  // E' anche piu' esatto del raycast: prova la sagoma vera invece della sua
  // triangolazione. L'unico scarto e' la parallasse fra sfera e calotta, che
  // sta 0,2 unita' piu' in alto: a 80 gradi di incidenza vale 0,65 gradi
  // d'arco, cioe' solo a filo dell'orizzonte, dove il paese e' comunque
  // schiacciato in pochi pixel.
  var PICK_NX = Math.round(360 / PICK_CELL_DEG);
  var PICK_NY = Math.round(180 / PICK_CELL_DEG);
  var pickGrid = null;                 // cella -> array di indici in pickParts
  var pickParts = [];                  // { rings, minX, minY, maxX, maxY, fi, area }

  function buildPickIndex() {
    pickGrid = new Array(PICK_NX * PICK_NY);
    pickParts = [];
    for (var fi = 0; fi < features.length; fi++) {
      var polys = polygonsOf(features[fi].geometry);
      for (var pi = 0; pi < polys.length; pi++) {
        var ring = polys[pi][0];
        var minX = 180, minY = 90, maxX = -180, maxY = -90;
        for (var k = 0; k < ring.length; k++) {
          var c = ring[k];
          if (c[0] < minX) minX = c[0];
          if (c[0] > maxX) maxX = c[0];
          if (c[1] < minY) minY = c[1];
          if (c[1] > maxY) maxY = c[1];
        }
        var part = {
          rings: polys[pi], minX: minX, minY: minY, maxX: maxX, maxY: maxY,
          fi: fi, area: (maxX - minX) * (maxY - minY)
        };
        var idx = pickParts.length;
        pickParts.push(part);
        var cx0 = Math.max(0, Math.floor((minX + 180) / PICK_CELL_DEG));
        var cx1 = Math.min(PICK_NX - 1, Math.floor((maxX + 180) / PICK_CELL_DEG));
        var cy0 = Math.max(0, Math.floor((minY + 90) / PICK_CELL_DEG));
        var cy1 = Math.min(PICK_NY - 1, Math.floor((maxY + 90) / PICK_CELL_DEG));
        for (var cy = cy0; cy <= cy1; cy++) {
          for (var cx = cx0; cx <= cx1; cx++) {
            var cell = cy * PICK_NX + cx;
            if (!pickGrid[cell]) pickGrid[cell] = [];
            pickGrid[cell].push(idx);
          }
        }
      }
    }
  }

  function inRing(ring, x, y) {
    var inside = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  /** Paese sotto una coordinata geografica, o null se e' oceano. */
  function countryAt(lat, lng) {
    if (!pickGrid) return null;
    var cx = Math.min(PICK_NX - 1, Math.max(0, Math.floor((lng + 180) / PICK_CELL_DEG)));
    var cy = Math.min(PICK_NY - 1, Math.max(0, Math.floor((lat + 90) / PICK_CELL_DEG)));
    var cand = pickGrid[cy * PICK_NX + cx];
    if (!cand) return null;
    var best = -1, bestArea = Infinity;
    for (var i = 0; i < cand.length; i++) {
      var p = pickParts[cand[i]];
      if (lng < p.minX || lng > p.maxX || lat < p.minY || lat > p.maxY) continue;
      if (!inRing(p.rings[0], lng, lat)) continue;
      var hole = false;
      for (var r = 1; r < p.rings.length; r++) {
        if (inRing(p.rings[r], lng, lat)) { hole = true; break; }
      }
      if (hole) continue;
      // Il poligono piu' piccolo vince: se un enclave e' modellato sia come
      // buco che come poligono a se' (Lesotho), si sceglie l'enclave.
      if (p.area < bestArea) { bestArea = p.area; best = p.fi; }
    }
    return best < 0 ? null : features[best];
  }

  // ------------------------------------------------------------ colorazione
  function capColorRgb(feat) {
    return visited.has(countryKey(feat)) ? VISITED_RGB : LAND_RGB;
  }

  /** Riscrive il colore per-vertice di una singola feature. */
  function paintFeature(fi) {
    if (!capColorArr) return;
    var r = capRange[fi];
    if (!r) return;
    var c = capColorRgb(features[fi]);
    var end = (r.start + r.count) * 3;
    for (var i = r.start * 3; i < end; i += 3) {
      capColorArr[i] = c[0]; capColorArr[i + 1] = c[1]; capColorArr[i + 2] = c[2];
    }
    capColorAttr.needsUpdate = true;
  }

  // Ridipingere non tocca piu' ne' geometria ne' scena: si riscrivono byte in
  // un attributo e si chiede un frame. Prima ogni toggle rientrava nel digest
  // di globe.gl su 470 gruppi.
  function repaint() {
    if (!capColorArr) return;
    for (var fi = 0; fi < features.length; fi++) paintFeature(fi);
    capColorAttr.needsUpdate = true;
    wake();
  }
  function repaintOne(key) {
    var fi = idxOf[key];
    if (fi == null) return;
    paintFeature(fi);
    wake();
  }

  // ------------------------------------------- costruzione della scena fusa
  //
  // globe.gl disegna ogni poligono come un gruppo a se': 470 poligoni fanno 470
  // mesh piu' 470 LineSegments, cioe' circa 1400 draw call e 940 oggetti che
  // three.js deve aggiornare, cullare e ordinare a ogni frame - e che il
  // raycast di hover deve attraversare venti volte al secondo. Su un telefono
  // del 2019 e' quello, non il numero di triangoli, a mangiarsi il frame.
  //
  // Qui il layer poligoni viene usato una volta sola come fabbrica di
  // geometrie: si prendono le calotte gia' tassellate, si fondono in UNA mesh
  // con colore per-vertice, e il layer viene smontato. Restano tre oggetti in
  // tutto: calotte, rete dei confini, contorno del selezionato.

  var THREE = null;                    // costruttori raccolti dagli oggetti vivi

  // three non e' esportato dal bundle di globe.gl (anzi, il bundle guarda se
  // window.THREE esiste per riusarlo, e qui non esiste). I costruttori si
  // prendono dagli oggetti che la libreria ha appena creato.
  function harvestThree(group) {
    var mesh = group.children[0];
    var line = group.children[1];
    var pos = mesh.geometry.getAttribute('position');
    // Le geometrie di three-globe sono sottoclassi di BufferGeometry con
    // costruttori che pretendono argomenti: si risale la catena finche' il
    // prototipo superiore non ha piu' setAttribute, cioe' fino a
    // BufferGeometry, il cui prototipo e' EventDispatcher.
    var proto = Object.getPrototypeOf(mesh.geometry);
    while (proto) {
      var up = Object.getPrototypeOf(proto);
      if (!up || typeof up.setAttribute !== 'function') break;
      proto = up;
    }
    return {
      BufferGeometry: proto.constructor,
      Float32BufferAttribute: pos.constructor,
      Mesh: mesh.constructor,
      LineSegments: line.constructor,
      LineBasicMaterial: line.material.constructor,
      MeshBasicMaterial: group.__defaultCapMaterial.constructor,
      Color: group.__defaultCapMaterial.color.constructor
    };
  }

  // I colori per-vertice three.js li usa cosi' come sono, in spazio lineare,
  // mentre material.color.set('#8a8a8a') passa per la conversione sRGB->lineare
  // della gestione colore. Facendo il giro da un THREE.Color si ottengono
  // esattamente i valori che la libreria avrebbe usato, qualunque sia la
  // gestione colore attiva: il grigio e l'arancione restano quelli richiesti.
  function toLinearRgb(hex) {
    var c = new THREE.Color();
    c.set(hex);
    return [c.r, c.g, c.b];
  }

  var noRaycast = function () {};

  function polygonGroups() {
    var out = [];
    world.scene().traverse(function (o) {
      if (o.__globeObjType === 'polygon') out.push(o);
    });
    return out;
  }

  /** Numero di poligoni attesi (un MultiPolygon ne produce uno per membro). */
  function expectedPolygonCount() {
    var n = 0;
    for (var i = 0; i < features.length; i++) n += polygonsOf(features[i].geometry).length;
    return n;
  }

  /**
   * Il layer poligoni non costruisce le geometrie in modo sincrono: kapsule
   * rimanda il digest, e globe.gl lo rimanda ancora finche' il globo non e'
   * pronto. Si aspetta che tutti i gruppi esistano e abbiano una geometria.
   */
  function waitForPolygons(want, onReady, onTimeout) {
    // Generosa: il controllo su "ready" precede quello sulla scadenza, quindi
    // un blocco lungo non fa fallire niente. Serve solo a non restare appesi
    // per sempre se il layer non costruisse mai, e con quattro volte i dati su
    // un telefono lento venti secondi erano diventati stretti.
    var deadline = performance.now() + 60000;
    (function poll() {
      var gs = polygonGroups();
      var ready = gs.length >= want;
      if (ready) {
        for (var i = 0; i < gs.length; i++) {
          var m = gs[i].children[0];
          if (!m || !m.geometry || !m.geometry.getAttribute('position')) { ready = false; break; }
        }
      }
      if (ready) { onReady(gs); return; }
      if (performance.now() > deadline) { onTimeout(gs.length, want); return; }
      requestAnimationFrame(poll);
    })();
  }

  /** Fonde le calotte in una sola mesh, con un intervallo di vertici per paese. */
  function buildCapMesh(groups) {
    // gruppo -> feature. Il dataMapper di globe.gl appende il dato avvolto
    // sull'oggetto three come __data, e il campo .data e' la feature originale.
    var byFeat = new Map();
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      var f = g.__data && g.__data.data;
      var m = g.children[0];
      if (!f || !m || !m.geometry) continue;
      var arr = byFeat.get(f);
      if (!arr) { arr = []; byFeat.set(f, arr); }
      arr.push(m);
    }

    var totV = 0, totI = 0, fi, j, meshes, geom, pos, ind;
    for (fi = 0; fi < features.length; fi++) {
      meshes = byFeat.get(features[fi]) || [];
      for (j = 0; j < meshes.length; j++) {
        geom = meshes[j].geometry;
        pos = geom.getAttribute('position');
        ind = geom.getIndex();
        totV += pos.count;
        totI += ind ? ind.count : pos.count;
      }
    }

    var position = new Float32Array(totV * 3);
    var color = new Float32Array(totV * 3);
    var index = new Array(totI);
    var vo = 0, io = 0;

    for (fi = 0; fi < features.length; fi++) {
      meshes = byFeat.get(features[fi]) || [];
      var start = vo;
      var rgb = capColorRgb(features[fi]);
      for (j = 0; j < meshes.length; j++) {
        var mesh = meshes[j];
        geom = mesh.geometry;
        pos = geom.getAttribute('position');
        ind = geom.getIndex();
        // La calotta nasce a raggio del globo e l'altitudine finisce nella
        // scala della mesh: qui la si incorpora nei vertici, cosi' l'oggetto
        // fuso sta a scala 1 e non serve toccarlo mai piu'.
        var s = mesh.scale.x || 1;
        var src = pos.array, base = vo * 3;
        for (var v = 0, n = pos.count * 3; v < n; v++) position[base + v] = src[v] * s;
        var cb = vo * 3;
        for (var q = 0, qn = pos.count; q < qn; q++) {
          color[cb + q * 3] = rgb[0];
          color[cb + q * 3 + 1] = rgb[1];
          color[cb + q * 3 + 2] = rgb[2];
        }
        if (ind) {
          for (var k = 0, kn = ind.count; k < kn; k++) index[io + k] = vo + ind.getX(k);
          io += ind.count;
        } else {
          for (var k2 = 0, kn2 = pos.count; k2 < kn2; k2++) index[io + k2] = vo + k2;
          io += pos.count;
        }
        vo += pos.count;
      }
      capRange[fi] = { start: start, count: vo - start };
    }

    var g2 = new THREE.BufferGeometry();
    g2.setAttribute('position', new THREE.Float32BufferAttribute(position, 3));
    var colAttr = new THREE.Float32BufferAttribute(color, 3);
    g2.setAttribute('color', colAttr);
    // Float32BufferAttribute copia l'array che riceve: per poter riscrivere i
    // colori a ogni toggle bisogna tenere il buffer che e' finito dentro.
    capColorArr = colAttr.array;
    capColorAttr = colAttr;
    // setIndex con un Array normale sceglie da solo fra Uint16 e Uint32.
    g2.setIndex(index);
    g2.computeBoundingSphere();

    var mat = new THREE.MeshBasicMaterial({ vertexColors: true, side: CAP_SIDE });
    capMesh = new THREE.Mesh(g2, mat);
    capMesh.raycast = noRaycast;          // il tocco passa da countryAt()
    capMesh.renderOrder = 0;
    return { vertices: totV, triangles: totI / 3 };
  }

  // Trasforma lat/lng in coordinate del globo passando dalla libreria, cosi'
  // la proiezione resta la stessa delle calotte anche se globe.gl cambia.
  function coordsAt(lat, lng, alt, out) {
    var p = world.getCoords(lat, lng, alt);
    out.push(p.x, p.y, p.z);
  }

  /**
   * Aggiunge uno spigolo suddiviso a un array piatto di coppie di vertici.
   * La suddivisione e' lineare in lat/lng, la stessa che usa three-globe per
   * i contorni: cosi' la linea segue il bordo della calotta invece di tagliare
   * una corda che sprofonda dentro la sfera.
   */
  function pushEdge(out, a, b, alt) {
    var dLng = b[0] - a[0];
    // Unico caso nel dataset: lo spigolo di chiusura dell'Antartide, da
    // (-180,-90) a (180,-90). I due estremi sono lo stesso punto sulla sfera,
    // il polo sud, ma interpolarli in lat/lng farebbe il giro del mondo.
    if (Math.abs(dLng) > 180) return;
    var dLat = b[1] - a[1];
    var mLat = (a[1] + b[1]) * 0.5 * Math.PI / 180;
    var len = Math.sqrt(dLat * dLat + dLng * dLng * Math.cos(mLat) * Math.cos(mLat));
    var steps = Math.max(1, Math.ceil(len / BORDER_STEP_DEG));
    var px = a[0], py = a[1];
    for (var i = 1; i <= steps; i++) {
      var f = i / steps;
      var qx = a[0] + dLng * f, qy = a[1] + dLat * f;
      coordsAt(py, px, alt, out);
      coordsAt(qy, qx, alt, out);
      px = qx; py = qy;
    }
  }

  function forEachRingOf(feat, fn) {
    var polys = polygonsOf(feat.geometry);
    for (var p = 0; p < polys.length; p++) {
      for (var r = 0; r < polys[p].length; r++) fn(polys[p][r]);
    }
  }

  /**
   * Rete dei confini: UNA LineSegments per tutto il pianeta, con ogni spigolo
   * disegnato una volta sola.
   *
   * Prima ogni paese portava il proprio contorno, e lungo una frontiera i
   * contorni di A e di B erano geometrie coincidenti: 2143 spigoli sui 9235 del
   * dataset venivano disegnati due volte, uno sopra l'altro. Con il depth test
   * che non riusciva a separarli (vedi il blocco sulle altitudini) il risultato
   * era il tremolio dei confini, tanto piu' evidente quanto piu' il globo era
   * piccolo. Il dataset ha topologia condivisa - mapshaper la preserva - quindi
   * i due spigoli hanno gli stessi identici vertici e la chiave canonica li
   * riconosce senza tolleranze: verificato, nessuno spigolo compare piu' di due
   * volte.
   */
  function buildBorderNetwork() {
    var seen = Object.create(null);
    var out = [];
    var dropped = 0;
    for (var i = 0; i < features.length; i++) {
      forEachRingOf(features[i], function (ring) {
        for (var k = 0; k < ring.length - 1; k++) {
          var a = ring[k], b = ring[k + 1];
          var ka = a[0] + ',' + a[1], kb = b[0] + ',' + b[1];
          var key = ka < kb ? ka + '|' + kb : kb + '|' + ka;
          if (seen[key]) { dropped++; continue; }
          seen[key] = 1;
          pushEdge(out, a, b, BORDER_ALT);
        }
      });
    }
    var geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(out), 3));
    geom.computeBoundingSphere();
    var mat = new THREE.LineBasicMaterial({ color: BORDER });
    var lines = new THREE.LineSegments(geom, mat);
    lines.raycast = noRaycast;
    lines.renderOrder = 1;
    return { object: lines, segments: out.length / 6, dropped: dropped };
  }

  /**
   * Contorni per paese, tutti in una geometria sola con i vertici di ogni paese
   * contigui. Mostrarne uno costa un setDrawRange: niente geometrie costruite o
   * buttate a ogni selezione, e nessun secondo oggetto in scena.
   */
  function buildOutlines() {
    var out = [];
    for (var i = 0; i < features.length; i++) {
      var start = out.length / 3;
      forEachRingOf(features[i], function (ring) {
        for (var k = 0; k < ring.length - 1; k++) pushEdge(out, ring[k], ring[k + 1], SEL_ALT);
      });
      outlineRange[i] = { start: start, count: out.length / 3 - start };
    }
    var geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(out), 3));
    geom.computeBoundingSphere();
    var mat = new THREE.LineBasicMaterial({ color: BORDER_SEL });
    outlineMesh = new THREE.LineSegments(geom, mat);
    outlineMesh.raycast = noRaycast;
    outlineMesh.renderOrder = 2;
    outlineMesh.visible = false;
    outlineMesh.frustumCulled = false;   // il draw range cambia, la bounding sphere no
    return { vertices: out.length / 3 };
  }

  /**
   * Il raggio del puntatore deve incontrare solo la sfera del globo. Tutto il
   * resto - calotte, confini, alone dell'atmosfera - viene escluso: il paese lo
   * decide countryAt() sulla lat/lng, e il raycast di globe.gl gira comunque
   * venti volte al secondo anche a dito fermo.
   */
  function restrictRaycast() {
    var globeGroup = null;
    world.scene().traverse(function (o) {
      if (o.__globeObjType === 'globe') globeGroup = o;
    });
    if (!globeGroup) { console.warn('[BeenThere] gruppo globo non trovato: raycast invariato'); return; }
    var keep = new Set();
    globeGroup.traverse(function (o) { keep.add(o); });
    world.scene().traverse(function (o) {
      if ((o.isMesh || o.isLine || o.isPoints) && !keep.has(o)) o.raycast = noRaycast;
    });
  }

  function buildMergedScene(groups) {
    THREE = harvestThree(groups[0]);
    LAND_RGB = toLinearRgb(LAND);
    VISITED_RGB = toLinearRgb(VISITED);

    var caps = buildCapMesh(groups);
    var borders = buildBorderNetwork();
    var outlines = buildOutlines();

    // Gli oggetti vanno nello stesso gruppo dei poligoni: e' il sistema di
    // riferimento in cui la libreria ha costruito le calotte e in cui
    // getCoords() restituisce le sue coordinate. Il layer poligoni svuota quel
    // gruppo solo in init, che e' gia' passato, e il digest successivo rimuove
    // soltanto gli oggetti che ha creato lui.
    var parent = groups[0].parent;
    parent.add(capMesh);
    parent.add(borders.object);
    parent.add(outlineMesh);

    // Smonta le 470 mesh e i 470 contorni: da qui in poi la scena e' la nostra.
    world.polygonsData([]);
    restrictRaycast();

    console.log('[BeenThere] scena fusa: ' + caps.vertices + ' vertici, ' +
                caps.triangles + ' triangoli in 1 mesh; confini ' +
                borders.segments + ' segmenti (' + borders.dropped +
                ' spigoli condivisi disegnati una volta sola); contorni ' +
                outlines.vertices + ' vertici');
  }

  // ------------------------------------------------------- piani di taglio
  //
  // Il rimedio decisivo allo sfarfallio. globe.gl imposta camera.near = 0.05 e
  // lascia far al valore di default: la precisione del depth buffer va come
  // z^2/(near * 2^bit), quindi a globo lontano il quanto di profondita' arriva
  // a 0,14 unita' con un depth a 24 bit e a decine di unita' con uno a 16.
  // Qualsiasi cosa si disegni a pochi centesimi di unita' sopra la calotta
  // finisce dentro quel rumore, e il confronto lo vince chi capita.
  // Stringendo near e far attorno al guscio che contiene globo e atmosfera il
  // rapporto far/near resta piccolo a ogni distanza e il quanto scende sotto le
  // 0,005 unita', cioe' sessanta volte meno del gradino fra i nostri gusci.
  // Guscio che deve stare fra i due piani: raggio del globo, piu' l'atmosfera
  // (0.15), piu' margine. A zoom massimo (distanza 700) da near 575 e far 825,
  // contro una geometria che va da 585 a 815: dieci unita' di margine da
  // entrambi i lati.
  var SHELL = 1.25;

  // Si confrontano i valori, non la distanza: e' l'unico modo per accorgersi
  // che qualcun altro ha rimesso mano ai piani. globe.gl riporta far al proprio
  // default quando la camera si ferma, e una guardia basata sulla sola
  // distanza non se ne accorgeva mai - i piani restavano larghi proprio a
  // globo fermo, cioe' quando si guardano i confini.
  function updateClipPlanes() {
    if (!world) return;
    var cam = world.camera();
    var d = cam.position.length();
    if (!(d > 0)) return;
    var shell = world.getGlobeRadius() * SHELL;
    var near = Math.max(0.5, d - shell);
    var far = d + shell;
    if (cam.near === near && cam.far === far) return;
    cam.near = near;
    cam.far = far;
    cam.updateProjectionMatrix();
  }

  // ------------------------------------------------- disegno su richiesta
  //
  // globe.gl tiene un requestAnimationFrame sempre acceso: ridisegna la scena e
  // rilancia il raycast del puntatore anche quando non si sta toccando niente e
  // sullo schermo non cambia un pixel. Su un telefono e' corrente sprecata, e
  // la corrente sprecata diventa calore e quindi throttling, cioe' meno
  // framerate proprio durante l'uso.
  //
  // Qui il ciclo resta acceso finche' c'e' qualcosa da mostrare - un dito sullo
  // schermo, l'inerzia dei controlli, un volo verso un paese, un colore appena
  // cambiato - e si ferma dopo. Ogni evento di puntatore riaccende, quindi
  // anche se una sveglia si perdesse basterebbe toccare lo schermo.
  var awakeUntil = 0, superviseRaf = 0, animPaused = false;
  var IDLE_GRACE_MS = 900;

  /**
   * La camera si e' mossa abbastanza da cambiare un pixel?
   *
   * Il criterio non puo' essere l'evento change dei controlli: con il damping
   * acceso OrbitControls continua a emetterlo per movimenti infinitesimi, e
   * legarci la sveglia significava non addormentarsi mai. Qui si guarda lo
   * spostamento vero. La soglia e' 0,002 unita' su un globo di raggio 100:
   * inquadrando il globo a pieno schermo un pixel vale circa un quarto di
   * unita', quindi si sta due ordini di grandezza sotto il visibile.
   */
  var lastCamX = NaN, lastCamY = 0, lastCamZ = 0;
  function cameraMoved() {
    var p = world.camera().position;
    if (lastCamX !== lastCamX) {        // primo giro
      lastCamX = p.x; lastCamY = p.y; lastCamZ = p.z;
      return true;
    }
    var dx = p.x - lastCamX, dy = p.y - lastCamY, dz = p.z - lastCamZ;
    if (dx * dx + dy * dy + dz * dz <= 4e-6) return false;
    lastCamX = p.x; lastCamY = p.y; lastCamZ = p.z;
    return true;
  }

  // Si tiene l'identificativo del frame invece di un flag "sto sorvegliando":
  // ogni wake() annulla il frame in sospeso e ne chiede uno nuovo, quindi ce
  // n'e' sempre esattamente uno e la sorveglianza si riarma da sola. Con un
  // flag, un frame mai consegnato - il browser puo' sospenderli, per esempio a
  // scheda nascosta - avrebbe lasciato la sveglia bloccata per sempre.
  function wake(ms) {
    if (!world) return;
    var until = performance.now() + (ms == null ? IDLE_GRACE_MS : ms);
    if (until > awakeUntil) awakeUntil = until;
    if (animPaused) { world.resumeAnimation(); animPaused = false; }
    if (superviseRaf) cancelAnimationFrame(superviseRaf);
    superviseRaf = requestAnimationFrame(supervise);
  }

  function supervise(t) {
    superviseRaf = 0;
    updateClipPlanes();
    sampleFrame(t);
    // Finche' il globo scorre per inerzia si continua a disegnare, senza
    // bisogno di indovinare in anticipo quanto durera' la frenata.
    if (cameraMoved() && t + 250 > awakeUntil) awakeUntil = t + 250;
    if (t >= awakeUntil) {
      animPaused = true;
      lastFrameT = 0;
      world.pauseAnimation();
      return;
    }
    superviseRaf = requestAnimationFrame(supervise);
  }

  function wireWakeEvents(container) {
    var on = function (target, type) {
      target.addEventListener(type, function () { wake(); }, { passive: true, capture: true });
    };
    ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'wheel',
     'touchstart', 'touchmove', 'touchend'].forEach(function (type) {
      on(container, type);
    });
    window.addEventListener('resize', function () { wake(); });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { lastCamDist = -1; wake(); }
    });
  }

  // ---------------------------------------------- risoluzione adattiva
  //
  // globe.gl parte a min(2, devicePixelRatio). Su un telefono con dpr 3 sono
  // gia' 2,25 volte meno pixel del pannello, ma su una GPU del 2019 anche
  // quello puo' non bastare: 720x1520 sono 1,1 milioni di frammenti per frame.
  // Se il ritmo resta sotto i ~42 fps per un secondo intero si scende di un
  // gradino, fino a 1. Non si risale mai: un su-e-giu' continuo si vedrebbe.
  // Il testo non ne risente - i nomi dei paesi li disegna Compose, e la card
  // del popup e' HTML in un CSS2DRenderer, non nel canvas WebGL.
  var prSteps = [], prIdx = 0;
  var lastFrameT = 0, frameCount = 0, slowCount = 0, warmup = 0;

  function initPixelRatioSteps() {
    // Il primo gradino e' quello che globe.gl imposta da solo: non si sale mai
    // sopra, altrimenti su un desktop a dpr 1 si finirebbe per chiedere piu'
    // pixel di quanti ne servono.
    var base = Math.min(2, window.devicePixelRatio || 1);
    var cand = [base, 1.5, 1.25, 1];
    prSteps = [];
    for (var i = 0; i < cand.length; i++) {
      var v = cand[i];
      if (v > base + 1e-6) continue;
      if (prSteps.length && v > prSteps[prSteps.length - 1] - 0.05) continue;
      prSteps.push(v);
    }
    if (!prSteps.length) prSteps = [base];
    prIdx = 0;
  }

  function sampleFrame(t) {
    if (prIdx >= prSteps.length - 1) return;     // gia' al minimo
    if (warmup < 90) { warmup++; lastFrameT = t; return; }
    if (lastFrameT) {
      var dt = t - lastFrameT;
      if (dt > 0 && dt < 500) {
        frameCount++;
        if (dt > 24) slowCount++;
        if (frameCount >= 60) {
          if (slowCount > 30) {
            prIdx++;
            try {
              world.renderer().setPixelRatio(prSteps[prIdx]);
              console.log('[BeenThere] risoluzione ridotta a ' + prSteps[prIdx] + 'x');
            } catch (e) { console.warn('setPixelRatio', e); }
          }
          frameCount = 0; slowCount = 0;
        }
      }
    }
    lastFrameT = t;
  }

  // -------------------------------------------------- popup del paese scelto
  // Un tocco sul globo non segna piu' niente: apre questa card, che il layer
  // htmlElements di globe.gl tiene ancorata al centroide del paese e sposta a
  // ogni frame. Il toggle dentro la card e' l'unica via per marcare un
  // visitato partendo dal globo.

  function buildPopup(d) {
    var feat = byKey[d.key];

    var root = document.createElement('div');
    root.className = 'pin';

    var stem = document.createElement('div'); stem.className = 'stem';
    var dot = document.createElement('div'); dot.className = 'dot';

    var card = document.createElement('div'); card.className = 'card';
    var hd = document.createElement('div'); hd.className = 'hd';

    var flag = flagEmoji(feat);
    if (flag) {
      var flagEl = document.createElement('span');
      flagEl.className = 'flag';
      flagEl.textContent = flag;
      hd.appendChild(flagEl);
    }
    var nameEl = document.createElement('span');
    nameEl.className = 'nm';
    hd.appendChild(nameEl);

    var tgl = document.createElement('button');
    tgl.className = 'tgl';
    tgl.type = 'button';
    tgl.setAttribute('role', 'switch');
    var labelEl = document.createElement('span');
    var sw = document.createElement('span'); sw.className = 'sw';
    sw.appendChild(document.createElement('i'));
    tgl.appendChild(labelEl);
    tgl.appendChild(sw);
    // stopPropagation: il tocco non deve raggiungere il listener sul document
    // che chiude i risultati della ricerca.
    tgl.addEventListener('click', function (ev) {
      ev.stopPropagation();
      applyToggle(d.key);
    });

    card.appendChild(hd);
    card.appendChild(tgl);
    root.appendChild(stem);
    root.appendChild(dot);
    root.appendChild(card);

    popupEls = { key: d.key, name: nameEl, toggle: tgl, label: labelEl };
    refreshPopup();
    return root;
  }

  // Rigenera solo il testo e lo stato dell'interruttore: l'elemento in scena
  // resta lo stesso, cosi' il popup non sfarfalla a ogni toggle.
  function refreshPopup() {
    if (!popupEls) return;
    var feat = byKey[popupEls.key];
    if (!feat) return;
    popupEls.name.textContent = countryName(feat);
    popupEls.label.textContent = t('visited');
    popupEls.toggle.setAttribute('aria-label', t('visitedAria'));
    popupEls.toggle.setAttribute('aria-checked', visited.has(popupEls.key) ? 'true' : 'false');
  }

  // Accendere il contorno del selezionato ora e' una sola istruzione: la
  // geometria dei contorni e' gia' in scena, si sposta solo la finestra di
  // disegno. Il paese non viene piu' sollevato - il sollevamento serviva a
  // scavalcare i muri laterali dei vicini, che non esistono piu'.
  function showOutline(key) {
    if (!outlineMesh) return;
    var fi = key == null ? null : idxOf[key];
    var r = fi == null ? null : outlineRange[fi];
    if (!r || !r.count) { outlineMesh.visible = false; return; }
    outlineMesh.geometry.setDrawRange(r.start, r.count);
    outlineMesh.visible = true;
  }

  function selectCountry(key) {
    var f = byKey[key];
    if (!f || !world) return false;
    var focus = focusOf(f);            // centroide dell'anello piu' grande
    selected = key;
    popupEls = null;                   // il layer ricostruira' l'elemento
    world.htmlElementsData([{ key: key, lat: focus.lat, lng: focus.lng }]);
    showOutline(key);
    wake();
    return true;
  }

  function clearSelection() {
    if (!selected) return;
    selected = null;
    popupEls = null;
    if (world) {
      world.htmlElementsData([]);
      showOutline(null);
      wake();
    }
  }

  /**
   * Il tocco e' atterrato dentro il popup?
   *
   * Serve perche' `pointer-events: auto` sulla card NON basta a fermare il
   * raycast. globe.gl ascolta il pointerup sul contenitore della scena e lo fa
   * **in fase di cattura**; il layer CSS2D, e quindi la card, vive dentro
   * quello stesso contenitore. Un listener in cattura su un antenato scatta
   * prima del bersaglio, percio' nessuno stopPropagation lanciato dalla card
   * puo' arrivare in tempo: l'evento e' gia' stato consumato. Il risultato era
   * che premere l'interruttore selezionava anche il paese che sta sotto la
   * card, e se sotto c'era oceano il popup si chiudeva da solo.
   *
   * Non si intercetta l'evento, lo si scarta qui: le callback di globe.gl
   * ricevono l'evento DOM originale, e target dice dove il dito e' davvero
   * atterrato. Solo .card riabilita i pointer events, quindi stelo e pallino
   * continuano a lasciar passare il tocco al paese sotto.
   */
  function fromPopup(ev) {
    var el = ev && ev.target;
    return !!(el && typeof el.closest === 'function' && el.closest('.pin'));
  }

  /** Unico punto d'ingresso del tocco sul globo: paese o oceano. */
  function handleGlobeClick(coords, ev) {
    if (fromPopup(ev)) return;
    var f = coords ? countryAt(coords.lat, coords.lng) : null;
    if (!f) { clearSelection(); return; }
    var key = countryKey(f);
    if (key === selected) clearSelection(); else selectCountry(key);
  }

  // -------------------------------------------------------- ponte con Kotlin
  function bridge() {
    return (typeof window.AndroidBridge !== 'undefined') ? window.AndroidBridge : null;
  }
  function notifyToggle(key, isVisited) {
    var b = bridge();
    if (b && typeof b.onCountryToggled === 'function') {
      try { b.onCountryToggled(key, isVisited); } catch (e) { console.warn('bridge', e); }
    }
  }

  function applyToggle(key) {
    if (!byKey[key]) return;
    var now = !visited.has(key);
    if (now) visited.add(key); else visited.delete(key);
    repaintOne(key);
    updateCounter();
    refreshRowStates();
    refreshPopup();
    saveDemo();
    notifyToggle(key, now);   // Kotlin persiste; può ri-pushare con setVisited()
  }

  // --------------------------------------------------------------- contatore
  function total() { return TOTAL_OVERRIDE != null ? TOTAL_OVERRIDE : features.length; }
  function updateCounter() {
    var el = $('counter');
    if (el) el.innerHTML = '<b>' + visited.size + '</b> / ' + total() + ' ' + t('countries');
  }

  function saveDemo() {
    if (!DEMO_PERSISTENCE) return;
    try { localStorage.setItem(LS_KEY, JSON.stringify(Array.from(visited))); } catch (e) {}
  }
  function loadDemo() {
    if (!DEMO_PERSISTENCE) return;
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) JSON.parse(raw).forEach(function (k) { if (byKey[k]) visited.add(k); });
    } catch (e) {}
  }

  // ----------------------------------------------------------------- ricerca
  function buildSearchIndex() {
    searchIndex = features.map(function (f) {
      var p = f.properties || {}, key = countryKey(f);
      var alts = [
        rawProp(p, ['NAME_IT']), rawProp(p, ['NAME']), rawProp(p, ['NAME_LONG']),
        rawProp(p, ['ADMIN']), rawProp(p, ['BRK_NAME']), rawProp(p, ['FORMAL_EN']),
        rawProp(p, ['NAME_EN']), rawProp(p, ['NAME_ES']), rawProp(p, ['NAME_FR']),
        rawProp(p, ['NAME_DE']), rawProp(p, ['ISO_A2']), key
      ].filter(Boolean);
      return { key: key, label: countryName(f), hay: norm(alts.join(' | ')), feat: f };
    }).sort(function (a, b) { return a.label.localeCompare(b.label); });
  }

  function searchCountries(q, limit) {
    var n = norm(String(q || '').trim());
    if (!n) return [];
    var starts = [], contains = [];
    for (var i = 0; i < searchIndex.length; i++) {
      var e = searchIndex[i], pos = e.hay.indexOf(n);
      if (pos < 0) continue;
      // inizio di una parola qualsiasi pesa più di un match a metà parola
      if (pos === 0 || /[\s|(-]/.test(e.hay.charAt(pos - 1))) starts.push(e);
      else contains.push(e);
    }
    return starts.concat(contains).slice(0, limit || 12);
  }

  function flyTo(key, ms) {
    var f = byKey[key];
    if (!f || !world) return false;
    var dur = ms == null ? 900 : ms;
    // Il volo e' un'animazione: il ciclo di disegno deve restare acceso per
    // tutta la sua durata, piu' l'inerzia che segue.
    wake(dur + IDLE_GRACE_MS);
    world.pointOfView(focusOf(f), dur);
    return true;
  }

  // ----------------------------------------------------------------- UI demo
  var resultsEl, searchEl, lastResults = [];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function renderResults(list) {
    lastResults = list; selIdx = list.length ? 0 : -1;
    if (!list.length) {
      resultsEl.innerHTML = '<div class="empty">' + escapeHtml(t('noResults')) + '</div>';
      resultsEl.classList.add('open');
      return;
    }
    resultsEl.innerHTML = list.map(function (e, i) {
      return '<div class="row' + (visited.has(e.key) ? ' on' : '') + (i === selIdx ? ' sel' : '') +
             '" data-key="' + e.key + '">' +
             '<span class="nm">' + escapeHtml(e.label) + '</span>' +
             '<span class="cc">' + escapeHtml(e.key) + '</span>' +
             '<button class="tg" type="button" data-toggle="1" ' +
             'aria-label="' + escapeHtml(t('visitedAria')) + '"><i></i></button></div>';
    }).join('');
    resultsEl.classList.add('open');
  }
  function refreshRowStates() {
    if (!resultsEl) return;
    Array.prototype.forEach.call(resultsEl.querySelectorAll('.row'), function (r) {
      r.classList.toggle('on', visited.has(r.getAttribute('data-key')));
    });
  }
  function closeResults() {
    if (resultsEl) { resultsEl.classList.remove('open'); lastResults = []; selIdx = -1; }
  }

  function wireUi() {
    $('ui').hidden = false;
    resultsEl = $('results');
    searchEl = $('search');
    searchEl.placeholder = t('searchPh');

    searchEl.addEventListener('input', function () {
      var q = searchEl.value.trim();
      if (!q) { closeResults(); return; }
      renderResults(searchCountries(q, 12));
    });
    searchEl.addEventListener('keydown', function (ev) {
      if (!lastResults.length) return;
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        selIdx = (selIdx + (ev.key === 'ArrowDown' ? 1 : -1) + lastResults.length) % lastResults.length;
        Array.prototype.forEach.call(resultsEl.querySelectorAll('.row'), function (r, i) {
          r.classList.toggle('sel', i === selIdx);
        });
      } else if (ev.key === 'Enter' && selIdx >= 0) {
        ev.preventDefault();
        flyTo(lastResults[selIdx].key); selectCountry(lastResults[selIdx].key);
        searchEl.blur(); closeResults();
      } else if (ev.key === 'Escape') {
        closeResults(); searchEl.blur();
      }
    });

    // click sulla riga -> vola sul paese e ne apre il popup; click sul pallino
    // -> toggle visitato. Il toggle da lista è la via di selezione per gli
    // stati troppo piccoli da colpire con il dito sul globo.
    resultsEl.addEventListener('click', function (ev) {
      var row = ev.target.closest ? ev.target.closest('.row') : null;
      if (!row) return;
      var key = row.getAttribute('data-key');
      if (ev.target.closest('[data-toggle]')) { ev.stopPropagation(); applyToggle(key); return; }
      flyTo(key); selectCountry(key); closeResults(); searchEl.blur();
    });

    document.addEventListener('pointerdown', function (ev) {
      if (!$('searchWrap').contains(ev.target)) closeResults();
    });
  }

  // ---------------------------------------------------------------- avvio
  function initGlobe(geojson) {
    var t0 = performance.now();
    features = (geojson.features || []).filter(function (f) { return f.geometry; });
    if (!features.length) { fail('Il GeoJSON non contiene feature.'); return; }

    // Prima di ogni altra cosa: verso degli anelli nella convenzione di d3-geo
    // (vedi il commento su rewindPolygon). Va fatto prima di polygonsData().
    var rewound = 0;
    features.forEach(function (f) { rewound += rewindGeometry(f.geometry); });
    if (rewound) console.log('[BeenThere] poligoni riavvolti per d3-geo:', rewound);

    var seen = Object.create(null), collisions = [];
    features.forEach(function (f, i) {
      var k = countryKey(f);
      if (seen[k]) collisions.push(k + ' -> ' + seen[k] + ' / ' + countryName(f));
      seen[k] = countryName(f);
      byKey[k] = f;
      idxOf[k] = i;
    });
    if (collisions.length) {
      console.warn('[BeenThere] chiavi paese duplicate (si colorerebbero insieme):', collisions);
    }
    console.log('[BeenThere] paesi caricati:', features.length);

    buildSearchIndex();
    buildPickIndex();
    loadDemo();
    initPixelRatioSteps();

    // Da qui in poi comanda la tassellatura, che blocca il thread per secondi.
    // La frase va cambiata PRIMA, e le va lasciato il tempo di arrivare a
    // schermo: due frame di respiro garantiscono che il disegno sia avvenuto,
    // altrimenti si leggerebbe "Carico i confini" per tutta l'attesa.
    setPhase(t('buildingGlobe'));
    var started = false;
    var go = function () {
      if (started) return;
      started = true;
      buildGlobe(t0);
    };
    // Due frame di respiro danno la garanzia che il disegno sia avvenuto, ma
    // non si puo' DIPENDERE da loro: un browser che non sta producendo frame -
    // una WebView non ancora visibile, una scheda in background - non consegna
    // requestAnimationFrame, e il globo non partirebbe mai. Il timeout e' la
    // rete: se i frame arrivano si parte subito dopo il disegno, altrimenti si
    // parte comunque.
    requestAnimationFrame(function () { requestAnimationFrame(go); });
    setTimeout(go, 250);
  }

  function buildGlobe(t0) {
    var container = document.getElementById('globe');

    world = Globe()(container)
      .backgroundColor(BG)
      .showAtmosphere(true)
      .atmosphereColor('#5b8fd6')
      .atmosphereAltitude(0.15)
      .polygonsData(features)
      .polygonAltitude(CAP_ALT)
      // per paese, non uniforme: vedi il blocco su CAP_TARGET_PTS
      .polygonCapCurvatureResolution(function (f) { return capResolution(f); })
      .polygonCapColor(function () { return LAND; })
      // false, non 'rgba(0,0,0,0)'. Nel layer poligoni di globe.gl 2.46.2 un
      // colore di fianco falsy vale includeSides = false, quindi i muri
      // laterali non vengono proprio costruiti. Prima erano trasparenti ma
      // c'erano: invisibili e comunque scritti nel depth buffer, e lungo ogni
      // frontiera i muri di due paesi arrivavano alla stessa quota. E' meta'
      // della ragione per cui i confini si spezzavano.
      .polygonSideColor(function () { return false; })
      // false: nessun contorno per-paese. Li rimpiazza una rete unica e
      // deduplicata (vedi buildBorderNetwork), che elimina i 2143 spigoli
      // disegnati due volte.
      .polygonStrokeColor(function () { return false; })
      .polygonsTransitionDuration(0)             // niente tween -> niente geometrie rigenerate
      // Il tocco non segna piu' il paese: lo seleziona e apre il popup, dove
      // il toggle e' esplicito. Toccare di nuovo lo stesso paese chiude.
      // Non c'e' piu' onPolygonClick: le calotte sono una mesh sola e non
      // rispondono al raggio, il paese lo decide countryAt() sulla lat/lng.
      .onGlobeClick(handleGlobeClick)
      // Layer htmlElements: la card del popup. La posizione la aggiorna
      // globe.gl a ogni frame, e il modifier di visibilita' la fa sparire in
      // dissolvenza quando il paese passa dietro l'orizzonte del globo.
      .htmlElementsData([])
      .htmlAltitude(POPUP_ALT)
      .htmlTransitionDuration(0)
      .htmlElement(function (d) { return buildPopup(d); })
      .htmlElementVisibilityModifier(function (el, isVisible) {
        el.classList.toggle('behind', !isVisible);
      })
      // Ogni movimento di camera (rotazione compresa: globe.gl aggancia questa
      // callback all'evento change dei controlli) ristringe i piani di taglio.
      // Non si chiama wake() qui: col damping acceso questo evento non smette
      // mai del tutto di arrivare, e il ciclo non si addormenterebbe piu'. A
      // tenerlo sveglio durante la frenata ci pensa cameraMoved().
      .onZoom(function () { updateClipPlanes(); });

    // oceano
    try {
      var mat = world.globeMaterial();
      mat.color.set(OCEAN);
      if (mat.emissive) { mat.emissive.set(OCEAN); mat.emissiveIntensity = 0.28; }
      if ('shininess' in mat) mat.shininess = 3;
    } catch (e) { console.warn('globeMaterial', e); }

    // Illuminazione quasi piatta: con la luce di default il lato in ombra
    // falserebbe i colori richiesti (#8a8a8a / #ff8c1a). Riguarda solo la sfera
    // dell'oceano: le calotte usano un materiale non illuminato.
    try {
      (world.lights() || []).forEach(function (l) {
        if (l.isAmbientLight) l.intensity = 3.4;
        else if (l.isDirectionalLight) l.intensity = 0.35;
      });
    } catch (e) { console.warn('lights', e); }

    try {
      var c = world.controls();
      c.enableDamping = true; c.dampingFactor = 0.12;
      c.minDistance = 130; c.maxDistance = 700;   // limiti di zoom / pinch
      c.enablePan = false;
      // rotateSpeed e zoomSpeed non si impostano qui: globe.gl li ricalcola
      // dall'altitudine a ogni evento change dei controlli, quindi qualsiasi
      // valore scritto adesso verrebbe sovrascritto al primo movimento.
    } catch (e) { console.warn('controls', e); }

    function resize() { world.width(window.innerWidth).height(window.innerHeight); }
    window.addEventListener('resize', resize);
    resize();
    world.pointOfView({ lat: 25, lng: 10, altitude: 2.4 }, 0);

    wireWakeEvents(container);
    updateClipPlanes();

    // Le calotte le tassella globe.gl, ma solo una volta: appena pronte
    // vengono fuse e il layer poligoni viene smontato.
    var want = expectedPolygonCount();
    waitForPolygons(want, function (groups) {
      try {
        buildMergedScene(groups);
      } catch (err) {
        console.error('[BeenThere] fusione della scena fallita', err);
        fail('Errore nella costruzione del globo &mdash; ' + err.message);
        return;
      }
      finishStartup(t0);
    }, function (got, expected) {
      fail('Il globo non ha finito di costruirsi (' + got + '/' + expected + ' poligoni).');
    });
  }

  function finishStartup(t0) {
    if (DEMO_UI) wireUi();
    updateCounter();
    wake();
    // Dissolvenza invece di uno stacco netto: il globo emerge mentre il
    // wireframe svanisce. Qui il thread e' di nuovo libero, quindi la
    // transizione gira liscia. Il display:none arriva dopo, altrimenti
    // taglierebbe la dissolvenza al primo fotogramma.
    statusEl.classList.add('fading');
    setTimeout(function () { statusEl.classList.add('hidden'); }, 420);
    console.log('[BeenThere] avvio in ' + Math.round(performance.now() - t0) + ' ms');

    var b = bridge();
    if (b && typeof b.onGlobeReady === 'function') {
      try { b.onGlobeReady(catalogJson()); } catch (e) { console.warn('bridge ready', e); }
    }
  }

  // ------------------------------------------------- API chiamata da Kotlin
  // (evaluateJavascript). Tutte idempotenti e sicure da chiamare più volte.
  window.BeenThere = {
    ready: function () { return !!capMesh; },
    // sostituisce integralmente lo stato: la sorgente di verità è DataStore
    setVisited: function (codes) {
      visited = new Set((codes || []).filter(function (k) { return !!byKey[k]; }));
      repaint(); updateCounter(); refreshRowStates(); refreshPopup();
    },
    setCountryVisited: function (code, isVisited) {
      if (!byKey[code]) return false;
      if (isVisited) visited.add(code); else visited.delete(code);
      repaintOne(code); updateCounter(); refreshRowStates(); refreshPopup();
      return true;
    },
    getVisited: function () { return JSON.stringify(Array.from(visited)); },
    // Vola sul paese e ne apre il popup: la ricerca nativa e la lista dei
    // visitati devono dare lo stesso risultato del tocco sul globo.
    focusCountry: function (code, ms) {
      var ok = flyTo(code, ms);
      if (ok) selectCountry(code);
      return ok;
    },
    /** Chiude il popup, se aperto. */
    clearSelection: function () { clearSelection(); },
    /**
     * Lingua della pagina, spinta da Kotlin: cambia i nomi dei paesi (NAME_IT
     * o NAME) e le poche stringhe disegnate qui. Rifa' anche l'indice di
     * ricerca, che tiene le etichette gia' risolte nella lingua corrente.
     */
    setLanguage: function (tag) {
      var next = (tag === 'en') ? 'en' : 'it';
      if (next === lang) return lang;
      lang = next;
      if (features.length) buildSearchIndex();
      if (searchEl) searchEl.placeholder = t('searchPh');
      updateCounter();
      if (lastResults.length) renderResults(searchCountries(searchEl ? searchEl.value : '', 12));
      refreshPopup();
      return lang;
    },
    // per la ricerca lato Compose: JSON [{code,name}]
    search: function (q, limit) {
      return JSON.stringify(searchCountries(q, limit || 12).map(function (e) {
        return { code: e.key, name: e.label };
      }));
    },
    // Stesso payload di onGlobeReady, se Kotlin dovesse richiederlo.
    catalog: function () { return catalogJson(); },
    countryCount: function () { return features.length; },
    setChromeVisible: function (v) { $('ui').hidden = !v; },
    /**
     * Diagnostica del rendering, da leggere in chrome://inspect quando si vuole
     * capire come sta andando sul telefono: oggetti disegnati, triangoli,
     * risoluzione in uso e stato del ciclo di disegno.
     */
    perf: function () {
      var info = null;
      try { info = world.renderer().info; } catch (e) {}
      return JSON.stringify({
        pixelRatio: prSteps[prIdx],
        pixelRatioSteps: prSteps,
        drawCalls: info ? info.render.calls : null,
        triangles: info ? info.render.triangles : null,
        objectsInScene: info ? info.memory.geometries : null,
        animating: !animPaused,
        cameraNear: world ? world.camera().near : null,
        cameraFar: world ? world.camera().far : null
      });
    }
  };

  // ------------------------------------------------------------ caricamento
  if (typeof Globe !== 'function') {
    fail('globe.gl non caricato.',
         'Manca <code>globe.gl.min.js</code> accanto a <code>index.html</code>.');
    return;
  }
  fetch('countries.geojson')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(initGlobe)
    .catch(function (err) {
      fail('Impossibile caricare countries.geojson &mdash; ' + err.message,
           'Se stai aprendo il file con <code>file://</code> il browser blocca la fetch.<br>' +
           'Avvia un server nella cartella assets:<br><code>python -m http.server 8000</code><br>' +
           'e apri <code>http://localhost:8000/index.html</code>.');
    });
})();
</script>
</body>
</html>
